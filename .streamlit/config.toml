# Streamlit settings for this project (read automatically by "streamlit run").
# [theme] = the colours and fonts of the whole app.
# Look (since the V4 design refresh): warm "parchment" page with paper-like cards,
# a charcoal accent, and a dark charcoal price strip at the top for the trading-desk feel.

[theme]
base = "light"

# Warm charcoal accent: buttons, selected tabs, switches
primaryColor = "#2B2A28"

backgroundColor = "#EDE3CF"            # page: parchment
secondaryBackgroundColor = "#F7F0E1"   # inputs, expanders, pop-up fields: lighter paper
textColor = "#2B2A28"                  # warm charcoal text (softer than pure black)
borderColor = "#D5C5A5"

# Favourable / unfavourable colours used by Streamlit (e.g. metric arrows)
greenColor = "#0F6E56"
redColor = "#C0392B"

baseFontSize = 14
baseRadius = "large"                   # rounded corners, like cards in a modern app

dataframeHeaderBackgroundColor = "#EFE6D3"
